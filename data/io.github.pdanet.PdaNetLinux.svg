<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#2b3b55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec27e"/>
      <stop offset="1" stop-color="#57e389"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- Phone -->
  <rect x="20" y="26" width="52" height="76" rx="9" fill="none" stroke="#dbe6ff" stroke-width="5"/>
  <rect x="36" y="33" width="20" height="3" rx="1.5" fill="#dbe6ff"/>
  <circle cx="46" cy="93" r="3.2" fill="#dbe6ff"/>

  <!-- USB/Ethernet cable from the phone -->
  <path d="M72 78 H84" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

  <!-- RJ45 plug -->
  <rect x="82" y="64" width="32" height="28" rx="5" fill="none" stroke="url(#accent)" stroke-width="5"/>
  <path d="M89 73 h17 M89 80 h17 M89 87 h17" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M114 73 h5 v10 h-5" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round"/>
</svg>
