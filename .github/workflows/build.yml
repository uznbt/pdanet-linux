name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      # The test suite imports gi.repository for the tray protocol.  Use the
      # distribution Python so PyGObject and the typelibs match each other.
      - name: Install GTK/GI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-gi \
            gir1.2-glib-2.0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1

      - name: Byte-compile sources
        run: python3 -m compileall -q pdanet_linux tests

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

  build:
    name: Build packages
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build frontend
        run: python3 -m pip install --disable-pip-version-check --upgrade build

      - name: Build sdist and wheel
        run: python3 -m build

      - name: Build source archive and checksums
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          safe_ref="${REF_NAME//\//-}"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="pdanet-linux-${safe_ref}/" \
            -o "dist/pdanet-linux-${safe_ref}.tar.gz" \
            HEAD
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdanet-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to upload assets to the GitHub Release

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: pdanet-linux
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
